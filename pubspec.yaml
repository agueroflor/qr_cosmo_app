name: qr_cosmo_app
description: "Application to generate and scan QR codes for guests."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_crashlytics: ^4.1.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  permission_handler: ^12.0.1
  intl: ^0.20.2
  provider: ^6.1.1
  crypto: ^3.0.3
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  image: ^4.1.7
  flutter_lints: ^6.0.0
  device_preview_plus: ^2.4.7

  # Clean Architecture dependencies
  flutter_bloc: ^8.1.6
  get_it: ^8.0.3
  dartz: ^0.10.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  bloc_test: ^9.1.7
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/images/logo.png
    - assets/images/logo-black.png